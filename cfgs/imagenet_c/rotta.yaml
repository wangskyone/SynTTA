INPUT_SIZE: (224, 224)
MODEL:
  ADAPTATION: rotta
  ARCH: resnet50
TEST:
  BATCH_SIZE: 64
  ALPHA_DIRICHLET: 0.005
CORRUPTION:
  DATASET: imagenet_c
  NUM_EX: 50000
  SEVERITY:
    - 5
  TYPE:
    - gaussian_noise
    - shot_noise
    - impulse_noise
    - defocus_blur
    - glass_blur
    - motion_blur
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression
OPTIM:
  METHOD: Adam
  STEPS: 1
  BETA: 0.9
  LR: 1e-3
  WD: 0.
